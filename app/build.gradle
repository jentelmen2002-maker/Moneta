plugins {
    id 'com.android.application'
}

android {
    namespace 'app.moneta'
    compileSdk 34

    defaultConfig {
        applicationId "app.moneta"
        minSdk 24
        targetSdk 34
        // Номер версии растёт с каждой сборкой на GitHub: Android принимает установку «поверх» только если номер не меньше
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName "1.0"
        // Репозиторий, где искать новые версии: GitHub подставляет его сам при сборке (пусто — проверка выключена)
        buildConfigField "String", "UPDATE_REPO", "\"${System.getenv('GITHUB_REPOSITORY') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Один и тот же ключ подписи для каждой сборки. Без него GitHub каждый раз создаёт новый ключ,
    // и Android не даёт обновить приложение — приходится удалять старое (вместе с данными).
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Выравнивает версии Kotlin у всех библиотек: иначе сборка падает с «Duplicate class kotlin...»
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
