name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # можно запустить вручную: вкладка Actions → Build APK → Run workflow

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # нужно, чтобы создать релиз с APK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK уже установлен на серверах GitHub; только принимаем лицензии,
      # чтобы Gradle мог докачать недостающие пакеты
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moneta-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Публикуем APK как релиз: по нему приложение узнаёт, что вышла новая версия
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Moneta.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Moneta (сборка ${{ github.run_number }})
          files: Moneta.apk
